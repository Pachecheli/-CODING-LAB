<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎀 coding lab 🎀</h1>
    <h3 class="subtitle">a 60 day coding sprint✨</h3>

    <h2 id="days" class="days">0</h2>
    <h2 class="label">DAYS LEFT</h2>

    <p id="time" class="time">00 : 00 : 00</p>
    <p class="hours">hrs  min sec</p>

    <p> 🌷 ♡ 🎀 ♡ 🌷</p>

    <script src="script.js"></script>
</body>
</html>
